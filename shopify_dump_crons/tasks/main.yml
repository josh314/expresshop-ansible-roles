- name: Set the crons
  cron:
    name: "{{ item.name }}"
    state: present
    job: "node {{ shopify_dump_crons__project_path }}/{{ item.script }}.js 1>> {{ shopify_dump_crons__log_path }}/{{ item.script }}.log 2>> {{ shopify_dump_crons__log_path }}/{{ item.script }}.err"
    month: "{{ item.month }}"
    day: "{{ item.day }}"
    weekday: "{{ item.weekday }}"
    hour: "{{ item.hour }}"
    minute: "{{ item.minute }}"
  with_items:
    - name: shopify_take_dump_cron
      script: dump-shopify-data-to-file
      month: "*"
      day: "*"
      weekday: "*"
      hour: "*"
      minute: "0"
    - name: shopify_metafield_dump_cron
      script: dump-metafields-to-file
      month: "*"
      day: "*"
      weekday: "*"
      hour: "*"
      minute: "20"
    - name: shopify_save_dump_cron
      script: save-shopify-dumps-to-db
      month: "*"
      day: "*"
      weekday: "*"
      hour: "*"
      minute: "45"