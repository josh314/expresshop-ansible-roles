---
# User and permissions
shopify_dump_crons__user: "{{ ansible_user }}"
shopify_dump_crons__local_deploy_key_file: ~/.ssh/aws_deploy_key_ed25519
shopify_dump_crons__remote_deploy_key_file: /home/{{ ansible_user }}/.ssh/shopify_dump_crons__deploy_key


# Project structure and permissions
shopify_dump_crons__project_path: "/home/{{ ansible_user }}/shopify-dump-crons"
shopify_dump_crons__log_path: "{{ shopify_dump_crons__project_path }}/logs"
shopify_dump_crons__dump_path: "{{ shopify_dump_crons__project_path }}/dump"

  # Database  defaults
shopify_dump_crons__mongo_host: localhost
shopify_dump_crons__mongo_port: 27017

# Repo defaults
shopify_dump_crons__application_repository: git@gitlab.com:wazue/shopify-data-dump.git
shopify_dump_crons__application_repository_version: master

