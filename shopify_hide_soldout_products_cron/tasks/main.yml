- name: copy deploy key
  copy:
    src: "{{ shopify_hide_soldout_products_cron__local_deploy_key_file }}"
    dest: "{{ shopify_hide_soldout_products_cron__remote_deploy_key_file }}"
    mode: "0600"

- name: install the cron code from git repo
  git:
    repo: "{{ shopify_hide_soldout_products_cron__application_repository }}"
    version: "{{ shopify_hide_soldout_products_cron__application_repository_version }}"
    dest: "{{ shopify_hide_soldout_products_cron__project_path }}"
    accept_hostkey: yes
    force: yes
    key_file: "{{ shopify_hide_soldout_products_cron__remote_deploy_key_file }}"

- name: install cron settings file
  template:
    src: settings.j2
    dest: "{{ shopify_hide_soldout_products_cron__project_path }}/settings.js"
    lstrip_blocks: yes

- name: install npm dependencies
  npm:
    ci: yes
    path: "{{ shopify_hide_soldout_products_cron__project_path }}/node_modules"

- name: create log directory
  file:
    path: "{{ shopify_hide_soldout_products_cron__log_path }}"
    owner: "{{ shopify_hide_soldout_products_cron__user }}"
    group: "{{ shopify_hide_soldout_products_cron__user }}"
    state: directory

####################################################
# Set cron
# =========
####################################################

- name: Set the cron
  cron:
    name: shopify_hide_soldout_products_cron
    state: present
    job: "node {{ shopify_hide_soldout_products_cron__project_path }}/index.js 1>> {{ shopify_hide_soldout_products_cron__log_path }}/shopify-hide-soldout-products.log 2>> {{ shopify_hide_soldout_products_cron__log_path }}/shopify-hide-soldout-products.err"
    month: "*"
    day: "*"
    weekday: "*"
    hour: "13"
    minute: "0"