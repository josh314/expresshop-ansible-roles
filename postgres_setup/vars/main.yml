

postgres_setup_table_data_type__url: varchar(4096)
postgres_setup_table_data_type__text: varchar(65536)

######################################################
# Table data
#
######################################################
postgres_setup_tables:

  - name: vendors
    columns:
      - date_added timestamp DEFAULT CURRENT_TIMESTAMP
      - date_modified timestamp DEFAULT CURRENT_TIMESTAMP
      - id serial PRIMARY KEY
      - vendor_name varchar(256)

  - name: incoming_inventory
    columns:
      - date_added timestamp DEFAULT CURRENT_TIMESTAMP
      - date_modified timestamp DEFAULT CURRENT_TIMESTAMP
      - id serial PRIMARY KEY
      - barcode varchar(16)
      - vendor_id integer REFERENCES vendors (id)
      - vendor_block_id varchar(256)
      - block_id varchar(256)

  - name: inventory_groups
    columns:
      - date_added timestamp DEFAULT CURRENT_TIMESTAMP
      - date_modified timestamp DEFAULT CURRENT_TIMESTAMP
      - id serial PRIMARY KEY
      - handle varchar(256)
      - description varchar(4096)

  - name: received_inventory
    columns:
      - date_added timestamp DEFAULT CURRENT_TIMESTAMP
      - date_modified timestamp DEFAULT CURRENT_TIMESTAMP
      - id serial PRIMARY KEY
      - barcode varchar(16)
      # - expiration_date

  - name: inventory_group_entities
    columns:
      - date_added timestamp DEFAULT CURRENT_TIMESTAMP
      - date_modified timestamp DEFAULT CURRENT_TIMESTAMP
      - id serial PRIMARY KEY
      - received_inventory_id integer REFERENCES received_inventory (id)
      - inventory_group_id integer REFERENCES inventory_groups (id)

  - name: entity_types
    columns:
      - id serial PRIMARY KEY
      - name varchar(32)

  - name: canonical_products
    columns:
      - id serial PRIMARY KEY
      - upc varchar(12)
      - upc_e varchar(8)  
      - ean varchar(13)
      - gtin varchar(14) 
      - name varchar(256)
      - short_description varchar(512)
      - long_description {{ postgres_setup_table_data_type__text }}
      - brand varchar(256)
      - msrp numeric(8,2)
      # - color
      # - size

  # - name: images
  #   columns:
  #     - id serial PRIMARY KEY
  #     - product_id integer REFERENCES products (id)
  #     - url {{ postgres_setup_table_data_type__url }}

