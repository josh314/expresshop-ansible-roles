- name: Create client views and grant privileges
  block:
    - name: Create client table views for {{ inventory_commander_add_client__client_name }}
      postgresql_query:
        db: "{{ inventory_commander_add_client__database_name }}"
        query: >
          CREATE OR REPLACE VIEW {{ inventory_commander_add_client__schema }}.{{ view.name }} AS
          {{ view.query }}
      with_items: "{{ inventory_commander_add_client__views }}"
      loop_control:
        loop_var: view

    - name: Grant privileges for {{ inventory_commander_add_client__client_name }} views
      postgresql_query:
        db: "{{ inventory_commander_add_client__database_name }}"
        query: >
          GRANT SELECT ON {{ inventory_commander_add_client__schema }}.{{ view.name }} TO {{ inventory_commander_add_client__client_admin_group }}
      with_items: "{{ inventory_commander_add_client__views }}"
      loop_control:
        loop_var: view
  when: inventory_commander_add_client__views is defined