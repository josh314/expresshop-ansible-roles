- name: Create btree indexes
  postgresql_idx:
    idxname: "{{ index.name }}"
    db: "{{ inventory_commander_add_client__database_name }}"
    schema: "{{ index.schema | default(inventory_commander_add_client__schema) }}"
    table: "{{ index.table }}"
    columns: "{{ index.columns }}"
  with_items: "{{ inventory_commander_add_client__indexes }}"
  loop_control:
    loop_var: index