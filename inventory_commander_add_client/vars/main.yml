

inventory_commander_add_client__data_type_url: varchar(4096)
inventory_commander_add_client__data_type_text: varchar(65536)

######################################################
# Table data
#
######################################################
inventory_commander_add_client__tables:

  - name: vendor
    columns:
      - id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY
      - vendor_name varchar(256) NOT NULL
      - date_added timestamp DEFAULT CURRENT_TIMESTAMP
      - date_modified timestamp DEFAULT CURRENT_TIMESTAMP

  - name: location
    columns:
      - id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY
      - name varchar(256) NOT NULL UNIQUE DEFAULT 'default'
      - address varchar(1024)
      - date_added timestamp DEFAULT CURRENT_TIMESTAMP
      - date_modified timestamp DEFAULT CURRENT_TIMESTAMP

  - name: package_group
    columns:
      - id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY
      - handle varchar(32) NOT NULL UNIQUE
      - description varchar(1024)
      - location_id integer REFERENCES {{ inventory_commander_add_client__schema }}.location (id) NOT NULL
      - date_added timestamp DEFAULT CURRENT_TIMESTAMP
      - date_modified timestamp DEFAULT CURRENT_TIMESTAMP

  - name: package
    columns:
      - id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY
      - package_group_id integer REFERENCES {{ inventory_commander_add_client__schema }}.package_group (id) NOT NULL
      - type package_type_enum
      - weight numeric
      - weight_units weight_units_enum
      - length numeric
      - length_units linear_units_enum
      - height numeric
      - height_units linear_units_enum
      - width numeric
      - width_units linear_units_enum
      - date_added timestamp DEFAULT CURRENT_TIMESTAMP
      - date_modified timestamp DEFAULT CURRENT_TIMESTAMP

  - name: incoming_inventory
    columns:
      - id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY
      - barcode varchar(16)
      - vendor_id integer REFERENCES {{ inventory_commander_add_client__schema }}.vendor (id)
      - vendor_block_id varchar(256)
      - block_id varchar(256)
      - date_added timestamp DEFAULT CURRENT_TIMESTAMP
      - date_modified timestamp DEFAULT CURRENT_TIMESTAMP

  - name: inventory_group
    columns:
      - id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY
      - handle varchar(256) NOT NULL
      - description varchar(4096)
      - date_added timestamp DEFAULT CURRENT_TIMESTAMP
      - date_modified timestamp DEFAULT CURRENT_TIMESTAMP

  - name: inventory_item
    columns:
      - id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY
      - product_id integer REFERENCES product (id) NOT NULL
      - location_id integer REFERENCES {{ inventory_commander_add_client__schema }}.location (id)
      - condition inventory_condition_enum
      - package_id integer REFERENCES {{ inventory_commander_add_client__schema }}.package (id)
      - expiration_date date
      - added_by_user_id integer REFERENCES app_user (id)
      - date_added timestamp DEFAULT CURRENT_TIMESTAMP
      - date_modified timestamp DEFAULT CURRENT_TIMESTAMP

  - name: inventory_group_inventory_item_mapping
    columns:
      - id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY
      - inventory_item_id integer NOT NULL REFERENCES {{ inventory_commander_add_client__schema }}.inventory_item (id)
      - inventory_group_id integer NOT NULL REFERENCES {{ inventory_commander_add_client__schema }}.inventory_group (id)
      - date_added timestamp DEFAULT CURRENT_TIMESTAMP
      - date_modified timestamp DEFAULT CURRENT_TIMESTAMP

  # - name: order
  #   columns:
  #     - id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY

  # - name: listing
  #   columns:
  #     - id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY

  # - name: shipment

  # - name: shipment_group

