

inventory_commander_add_client__data_type_url: varchar(4096)
inventory_commander_add_client__data_type_text: varchar(65536)

######################################################
# Table data
#
######################################################
inventory_commander_add_client__tables:


  - name: locations
    columns:
      - id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY
      - name varchar(256) NOT NULL UNIQUE DEFAULT 'default'
      - address varchar(1024)
      - date_added timestamp DEFAULT CURRENT_TIMESTAMP
      - date_modified timestamp DEFAULT CURRENT_TIMESTAMP

  - name: vendors
    columns:
      - id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY
      - vendor_name varchar(256) NOT NULL
      - date_added timestamp DEFAULT CURRENT_TIMESTAMP
      - date_modified timestamp DEFAULT CURRENT_TIMESTAMP

  - name: incoming_inventory
    columns:
      - id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY
      - barcode varchar(16)
      - vendor_id integer REFERENCES {{ inventory_commander_add_client__schema }}.vendors (id)
      - vendor_block_id varchar(256)
      - block_id varchar(256)
      - date_added timestamp DEFAULT CURRENT_TIMESTAMP
      - date_modified timestamp DEFAULT CURRENT_TIMESTAMP

  - name: inventory_groups
    columns:
      - id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY
      - handle varchar(256) NOT NULL
      - description varchar(4096)
      - date_added timestamp DEFAULT CURRENT_TIMESTAMP
      - date_modified timestamp DEFAULT CURRENT_TIMESTAMP

  - name: inventory_items
    columns:
      - id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY
      - barcode varchar(16)
      - location_id integer REFERENCES {{ inventory_commander_add_client__schema }}.locations (id)
      - date_added timestamp DEFAULT CURRENT_TIMESTAMP
      - date_modified timestamp DEFAULT CURRENT_TIMESTAMP
      # - expiration_date

  - name: inventory_group_inventory_item_mappings
    columns:
      - id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY
      - inventory_item_id integer NOT NULL REFERENCES {{ inventory_commander_add_client__schema }}.inventory_items (id)
      - inventory_group_id integer NOT NULL REFERENCES {{ inventory_commander_add_client__schema }}.inventory_groups (id)
      - date_added timestamp DEFAULT CURRENT_TIMESTAMP
      - date_modified timestamp DEFAULT CURRENT_TIMESTAMP

###############################################################
# Views
#
###############################################################


inventory_commander_add_client__views:

  - name: inventory_group_items
    query: >
      SELECT
        ig.handle AS lot_handle,
        ii.id AS inventory_item_id,
        ii.barcode AS barcode
      FROM
        {{ inventory_commander_add_client__schema }}.inventory_groups as ig,
        {{ inventory_commander_add_client__schema }}.inventory_group_inventory_item_mappings as igiim,
        {{ inventory_commander_add_client__schema }}.inventory_items as ii
      WHERE
        ig.id=igiim.inventory_group_id AND ii.id=igiim.inventory_item_id

###############################################################
# Indexes
#
###############################################################

inventory_commander_add_client__indexes:
  - name: inventory_groups__handle__idx
    table: inventory_grous
    columns: handle

  - name: inventory_group_inventory_item_mappings__inventory_group_id__idx
    table: inventory_group_inventory_item_mappings
    columns: inventory_group_id

  - name: inventory_group_inventory_item_mappings__inventory_item_id__idx
    table: inventory_group_inventory_item_mappings
    columns: inventory_item_id