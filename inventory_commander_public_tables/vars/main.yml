inventory_commander_public_tables__tables:

  - name: app_client_account
    columns:
      - id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY
      - name varchar(256)
      - admin_group varchar(32) NOT NULL UNIQUE
      - date_added timestamp DEFAULT CURRENT_TIMESTAMP
      - date_modified timestamp DEFAULT CURRENT_TIMESTAMP

  - name: app_user
    columns:
      - id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY
      - account_id integer REFERENCES app_client_account (id) NOT NULL
      - name varchar(256)
      - username varchar(32) NOT NULL
      - date_added timestamp DEFAULT CURRENT_TIMESTAMP
      - date_modified timestamp DEFAULT CURRENT_TIMESTAMP

  - name: product
    columns:
      - id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY
      - name varchar(256)
      - description {{ inventory_commander_public_tables__data_type_text }}
      - upc varchar(12) CONSTRAINT upc_length CHECK (char_length(upc)=12)
      - upce varchar(8) CONSTRAINT upce_length CHECK (char_length(upce)=8)
      - ean varchar(13) CONSTRAINT ean_length CHECK (char_length(ean)=13)
      - gtin varchar(14) CONSTRAINT gtin_length CHECK (char_length(gtin)=14)
      - added_by_user_id integer REFERENCES app_user (id)
      - date_added timestamp DEFAULT CURRENT_TIMESTAMP
      - date_modified timestamp DEFAULT CURRENT_TIMESTAMP

  - name: merchant
    columns:
      - id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY
      - name varchar(256)
      - url {{ inventory_commander_public_tables__data_type_url }}

  - name: merchant_product_offer
    columns:
      - id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY
      - merchant_id integer REFERENCES merchant (id)
      - product_id integer REFERENCES product (id)
      - title varchar(512)
      - condition inventory_condition_enum
      - price numeric
      - shipping numeric
      - currency currency_enum
      - link {{ inventory_commander_public_tables__data_type_url }}