---
# User and permissions
shopify_discount_code_notifier_cron__user: "{{ ansible_user }}"
shopify_discount_code_notifier_cron__local_deploy_key_file: ~/.ssh/aws_deploy_key_ed25519
shopify_discount_code_notifier_cron__remote_deploy_key_file: /home/{{ ansible_user }}/.ssh/shopify_discount_code_notifier_cron__deploy_key

# Project structure and permissions
shopify_discount_code_notifier_cron__project_path: "/home/{{ ansible_user }}/shopify-discount-code-notifier"
shopify_discount_code_notifier_cron__log_path: "{{ shopify_discount_code_notifier_cron__project_path }}/logs"

# Repo defaults
shopify_discount_code_notifier_cron__application_repository: git@gitlab.com:wazue/shopify-discount-code-notifier.git
shopify_discount_code_notifier_cron__application_repository_version: master

