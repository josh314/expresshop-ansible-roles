##########################################################################
# Installation and configure
# ==========================
#
##########################################################################


- name: add_mongo_repo
  import_role:
    name: add_mongo_repo

- name: install mongodb
  apt:
    pkg: mongodb-org
    state: latest
    update_cache: yes

- name: Install pip
  apt:
    name: python3-pip

- name: Install python packages
  pip:
    name:
      - pymongo>=4.0

- name: install config file
  template:
    src: mongod.conf.j2
    dest: "{{ mongodb_config_file }}"
    mode: 0644
    owner: "{{ mongodb_system_user }}"
    group: "{{ mongodb_system_group }}"

- name: ensure database directory and permissions
  file:
    name: "{{ mongodb_db_dir_path }}"
    state: directory
    mode: 0755
    owner: "{{ mongodb_system_user }}"
    group: "{{ mongodb_system_group }}"

- name: ensure log directory and permissions
  file:
    name: "{{ mongodb_log_dir_path }}"
    state: directory
    mode: 0755
    owner: "{{ mongodb_system_user }}"
    group: "{{ mongodb_system_group }}"

- name: start mongodb daemon
  service:
    name: mongod
    state: restarted
    enabled: yes
