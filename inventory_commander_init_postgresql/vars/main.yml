
inventory_commander_init_postgresql__data_type_url: varchar(4096)
inventory_commander_init_postgresql__data_type_text: varchar(65536)

######################################################
# Enum types
#
######################################################
inventory_commander_init_postgresql__enums:

  - name: inventory_condition_enum
    values:
      - new
      - case-packed
      - shelf-pull
      - customer return
      - salvage
      - damaged
      - as is

######################################################
# Table data
#
######################################################
inventory_commander_init_postgresql__tables:

  - name: app_client
    columns:
      - id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY
      - name varchar(256)
      - admin_group varchar(32) NOT NULL UNIQUE
      - date_added timestamp DEFAULT CURRENT_TIMESTAMP
      - date_modified timestamp DEFAULT CURRENT_TIMESTAMP

  - name: app_user
    columns:
      - id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY
      - name varchar(256)
      - username varchar(32) NOT NULL
      - admin_group varchar(32) NOT NULL UNIQUE
      - date_added timestamp DEFAULT CURRENT_TIMESTAMP
      - date_modified timestamp DEFAULT CURRENT_TIMESTAMP

  - name: product
    columns:
      - id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY
      - name varchar(256)
      - description {{ inventory_commander_init_postgresql__data_type_text }}
      - upc varchar(12) CONSTRAINT upc_length CHECK (char_length(upc)=12)
      - upce varchar(8) CONSTRAINT upce_length CHECK (char_length(upce)=12)
      - ean varchar(13) CONSTRAINT ean_length CHECK (char_length(ean)=13)
      - gtin varchar(14) CONSTRAINT gtin_length CHECK (char_length(gtin)=14)
      - added_by_user_id integer REFERENCES app_user (id)
      - date_added timestamp DEFAULT CURRENT_TIMESTAMP
      - date_modified timestamp DEFAULT CURRENT_TIMESTAMP

  - name: store
    columns:
      - id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY
      - name varchar(256)
      - url {{ inventory_commander_init_postgresql__data_type_url }}

  - name: store_product_offer
    columns:
      - id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY
      - store_id integer REFERENCES store (id)
      - product_id integer REFERENCES product (id)