
- name: Import the public key used by the package management system
  apt_key:
    url: https://www.mongodb.org/static/pgp/server-{{ mongodb_major_version }}.0.asc
    state: present

- name: Add MongoDB repository
  apt_repository:
    repo: deb [ arch=amd64 ] https://repo.mongodb.org/apt/ubuntu {{ ubuntu_version_codename }}/mongodb-org/{{ mongodb_major_version }}.0 multiverse
    state: present
