
- name: Add ansible PPA and install
  block:

  - name: Update APT cache & install PPA-management package
    apt:
      name: software-properties-common
      update-cache: yes

  - name: Add Ansible PPA repository
    apt_repository:
      repo: ppa:ansible/ansible
      state: present

  - name: Update APT cache & install Ansible
    apt:
      update-cache: yes
      name: ansible

  become: yes
  

- name: Install Expresshop ansible roles
  block:

  - name: ensure roles directory
    file:
      path: "{{ ansible_roles_directory }}"
      mode: 0700
      # owner: "{{ ansible_user }}"
      # group: "{{ ansible_user }}"
      state: directory

  # - name: Configure remote as a deploy client of Gitlab
  #   import_role:
  #     name: gitlab_deploy_client

  - name: Copy deploy key
    copy:
      src: expresshop-ansible-roles-deploy-key
      dest: "{{ remote_deploy_key_file }}"
      mode: "0600"
      # owner: "{{ ansible_user }}"
      # group: "{{ ansible_user }}"

  - name: install ansible role(s)
    git: 
      repo: "{{ ansible_roles_repo }}"
      version: "{{ ansible_roles_repo_version }}"
      dest: "{{ ansible_roles_directory }}"
      accept_hostkey: yes
      force: yes
    
  become_user: "{{ ansible_user }}"
  when: install_expresshop_roles