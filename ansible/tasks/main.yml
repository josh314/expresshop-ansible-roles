
- name: Install Ansible and configure
  block:

  - name: Install Pip & Python dev tools
    apt:
      update-cache: yes
      pkg:
        - python3-pip
        - python3-dev

  - name: Install Ansible with Pip
    pip:
      name: ansible

  # - name: ensure ansible directory exists
  #   file:
  #     path: /etc/ansible
  #     mode: 0600
  #     state: directory

  # - name: Install ansible config file
  #   copy:
  #     src: ansible.cfg
  #     dest: /etc/ansible/ansible.cfg
  #     mode: "0600"
      
  become: yes
  

- name: Install Expresshop ansible roles
  block:

  - name: ensure roles directory
    file:
      path: "{{ ansible_roles_directory }}"
      mode: 0700
      # owner: "{{ ansible_user }}"
      # group: "{{ ansible_user }}"
      state: directory

  # - name: Configure remote as a deploy client of Gitlab
  #   import_role:
  #     name: gitlab_deploy_client

  - name: Copy deploy key
    copy:
      src: expresshop-ansible-roles-deploy-key
      dest: "{{ remote_deploy_key_file }}"
      mode: "0600"
      # owner: "{{ ansible_user }}"
      # group: "{{ ansible_user }}"

  - name: install ansible role(s)
    git: 
      repo: "{{ ansible_roles_repo }}"
      version: "{{ ansible_roles_repo_version }}"
      dest: "{{ ansible_roles_directory }}"
      accept_hostkey: yes
      force: yes
      key_file: "{{ remote_deploy_key_file }}"
    
  become_user: "{{ ansible_user }}"
  when: install_expresshop_roles