---

####################################################################
# REQUIRED
# ========
#
####################################################################

# mongo_s3_restore_db_user
# mongo_s3_restore_db_password

####################################################################
# Optional
# ========
#
####################################################################

# If not defined, will use the most recent object from bucket
#
# mongo_s3_restore_s3_object

# mongo_s3_restore_aws_access_key / mongo_s3_restore_aws_secret_key
# If undefined, no ~/.aws/credentials profile is written and all AWS
# calls fall back to the default botocore credential chain (e.g. an
# EC2 instance role).

####################################################################
# Defaults
# ========
#
####################################################################

mongo_s3_restore_working_dir: /home/{{ ansible_user }}/tmp
mongo_s3_restore_db_host: localhost
mongo_s3_restore_db_port: 27017
mongo_s3_restore_boto_script_user: "{{ ansible_user }}"